name: Build APK (Cloud, no Android Studio)

# 这个流水线让你不用装 Android Studio：
# 把 PhoneCdBurner 推到 GitHub 仓库，GitHub 的云服务器会自动编译出 debug APK，
# 在 Actions 页面点开这次运行 → Artifacts 里就能下载 PhoneCdBurner-debug-apk。
#
# 触发方式：
#   1) 往 main/master 分支 push 代码会自动触发；
#   2) 也能在仓库的 Actions 标签里手动 "Run workflow" 触发（workflow_dispatch）。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 手动安装 Android SDK 命令行工具（不依赖已失效的 setup-android action）
      - name: Setup Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          python3 -c "import zipfile; zipfile.ZipFile('cmdline-tools.zip').extractall('$ANDROID_HOME/cmdline-tools')"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        # 项目未提交 gradlew 包装脚本，这里直接指定 Gradle 8.4（与本地构建一致）
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.4
          arguments: assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCdBurner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
